<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Roller Coaster Revolution - Gameplay Pixel</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee8c2b",
                        "pixel-dark": "#121212",
                        "pixel-panel": "#2d3748",
                    },
                    fontFamily: {
                        "pixel": ['"Press Start 2P"', "cursive"],
                        "digital": ['"VT323"', "monospace"]
                    },
                    boxShadow: {
                        "retro": "4px 4px 0px 0px rgba(0,0,0,1)",
                        "retro-sm": "2px 2px 0px 0px rgba(0,0,0,1)",
                        "retro-lg": "6px 6px 0px 0px rgba(0,0,0,1)",
                    },
                    borderWidth: {
                        "3": "3px",
                    }
                },
            },
        }
    </script>
<style>.scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
        }@keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            10% { opacity: 0.97; }
            15% { opacity: 0.99; }
            20% { opacity: 0.95; }
            50% { opacity: 0.98; }
            100% { opacity: 0.97; }
        }
        .crt-flicker {
            animation: flicker 0.15s infinite;
        }.btn-retro:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px rgba(0,0,0,1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-900 font-pixel text-white select-none overflow-hidden h-screen w-full">
<div class="relative h-full w-full flex flex-col crt-flicker">
<div class="absolute inset-0 z-0 bg-black overflow-hidden">

</div>
<div class="absolute inset-0 bg-blue-900/10 mix-blend-overlay"></div>
<div class="absolute inset-0 bg-[radial-gradient(circle,rgba(0,0,0,0)_60%,rgba(0,0,0,0.5)_100%)] pointer-events-none"></div>
<div class="absolute inset-0 scanlines z-10 pointer-events-none opacity-50"></div>
</div>
<div class="relative z-20 w-full p-4 flex items-start justify-between">
<div class="flex flex-col gap-1">
<div class="bg-blue-800 border-4 border-white shadow-retro px-4 py-3 transform -skew-x-2 origin-top-left">
<p class="text-yellow-300 text-[10px] uppercase mb-1 drop-shadow-md tracking-wider">Score</p>
<h2 class="text-white text-sm md:text-lg leading-none drop-shadow-md">12,450</h2>
<div class="w-full h-1 bg-white/20 mt-1 mb-1"></div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-yellow-400 text-sm">bolt</span>
<span class="text-yellow-400 text-[8px] md:text-[10px]">x2 BONUS</span>
</div>
</div>
</div>
<div class="flex flex-col items-center gap-3 flex-1 px-2 md:px-4 max-w-sm mx-auto">
<div class="bg-black border-4 border-gray-300 shadow-retro px-6 py-1 flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-red-500 text-lg">timer</span>
<p class="text-red-500 font-digital text-5xl leading-none tracking-widest mt-1">01:14</p>
</div>
<div class="w-full bg-gray-700 border-4 border-black h-8 relative shadow-retro-sm">
<div class="absolute inset-0 flex flex-col justify-center space-y-1 opacity-30 px-1">
<div class="w-full h-0.5 bg-black"></div>
<div class="w-full h-0.5 bg-black"></div>
</div>
<div class="h-full bg-primary relative border-r-4 border-black" style="width: 45%;">
<div class="absolute inset-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, #000 5px, #000 10px);"></div>
</div>
<div class="absolute top-1/2 -translate-y-1/2 left-[33%] w-3 h-3 bg-white border-2 border-black rotate-45 z-10"></div>

</div>
<div>

</button>
</div>
</div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none w-full text-center">
<div class="animate-[bounce_1s_infinite]">

<span class="text-red-500">+500</span> AIR TIME!
            </p>
</div>
</div>

<button class="btn-retro group relative flex items-center justify-center w-20 h-20 bg-red-600 border-b-8 border-r-8 border-t-4 border-l-4 border-black border-l-red-400 border-t-red-400 border-b-red-900 border-r-red-900 shadow-retro active:border-4 active:border-black">
<span class="material-symbols-outlined text-4xl text-white drop-shadow-md">close</span>
</button>
<div class="bg-black text-white text-[10px] uppercase border-2 border-white px-2 py-1 shadow-retro-sm">Brake</div>
</div>
<div class="flex-1 flex flex-col items-center justify-end px-4 pb-1">
<div class="w-full max-w-[240px] flex flex-col gap-2 items-center bg-gray-800 p-2 border-4 border-white shadow-retro">
<div class="flex w-full justify-between text-white text-[8px] uppercase tracking-widest font-bold">
<span>Safe</span>
<span class="text-red-500 bg-black px-1">DANGER</span>
</div>
<div class="w-full h-8 bg-black border-2 border-gray-600 p-1 relative">
<div class="absolute inset-1 bg-[linear-gradient(90deg,transparent_20%,#000_20%)] bg-[length:10px_100%] z-10 pointer-events-none opacity-50"></div>
<div class="h-full bg-gradient-to-r from-green-500 via-yellow-400 to-red-600 w-[75%] relative">
<div class="absolute top-0 w-full h-1/2 bg-white/30"></div>
</div>
</div>
<div class="flex items-baseline gap-2 bg-black px-3 py-1 border border-gray-600">
<span class="text-gray-400 text-[10px] uppercase">G-FORCE</span>
<p class="text-green-400 font-digital text-2xl leading-none">3.2<span class="text-sm">g</span></p>
</div>
</div>
</div>
<div class="flex flex-col items-center gap-2">
<button class="btn-retro group relative flex items-center justify-center w-24 h-24 bg-primary border-b-8 border-r-8 border-t-4 border-l-4 border-black border-l-orange-300 border-t-orange-300 border-b-orange-800 border-r-orange-800 shadow-retro active:border-4 active:border-black">
<div class="absolute inset-2 border-4 border-dashed border-black/20 rounded-sm animate-[spin_6s_linear_infinite]"></div>
<span class="material-symbols-outlined text-5xl font-bold drop-shadow-md text-white">fast_forward</span>
</button>
<div class="bg-black text-primary text-[10px] uppercase border-2 border-primary px-2 py-1 shadow-retro-sm">Boost</div>
</div>
</div>
</div>
