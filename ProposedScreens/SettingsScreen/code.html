<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings - Roller Coaster Revolution</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee8c2b",
                        "primary-dark": "#d67515",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221910",
                        "surface-dark": "#322419",
                        "border-retro": "#674d32",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "sm": "0.125rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    boxShadow: {
                        "retro": "4px 4px 0px 0px rgba(0, 0, 0, 0.4)",
                        "retro-sm": "2px 2px 0px 0px rgba(0, 0, 0, 0.4)",
                    }
                },
            },
        }
    </script>
<style>
        /* Retro CRT Scanline Effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 50;
        }
        
        /* Custom range slider thumb styling for visual fidelity if we used input range, 
           but here we are using custom divs as per component list. */
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-x-hidden">
<!-- Scanline Overlay -->
<div class="scanlines"></div>
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto border-x border-border-retro/30 shadow-2xl">
<!-- Header -->
<header class="sticky top-0 z-40 bg-background-dark border-b-4 border-border-retro p-4 pb-3 shadow-lg">
<div class="flex items-center justify-between">
<button class="flex size-10 shrink-0 items-center justify-center rounded-sm border-2 border-border-retro bg-surface-dark text-primary active:translate-y-1 active:shadow-none shadow-retro-sm transition-all">
<span class="material-symbols-outlined" style="font-size: 28px;">arrow_back</span>
</button>
<h2 class="text-white text-xl font-bold leading-tight tracking-widest uppercase text-shadow-sm">Configuration</h2>
<div class="size-10"></div> <!-- Spacer for alignment -->
</div>
</header>
<!-- Content Scrollable Area -->
<main class="flex-1 flex flex-col gap-6 p-4">
<!-- Audio Section -->
<section>
<div class="flex items-center gap-3 mb-4">
<span class="material-symbols-outlined text-primary">volume_up</span>
<h3 class="text-white text-lg font-bold tracking-wide uppercase border-b-2 border-primary/50 flex-1 pb-1">Audio</h3>
</div>
<!-- Music Volume Slider -->
<div class="bg-surface-dark border-2 border-border-retro rounded-sm p-4 shadow-retro-sm mb-4">
<div class="flex items-center justify-between mb-3">
<label class="text-primary font-bold tracking-wide text-sm">MUSIC VOLUME</label>
<span class="text-white font-mono text-sm bg-black/40 px-2 py-0.5 rounded-sm">75%</span>
</div>
<div class="relative flex h-6 w-full items-center">
<!-- Track Background -->
<div class="flex h-3 w-full rounded-sm bg-black/60 border border-border-retro relative overflow-hidden">
<!-- Fill -->
<div class="h-full w-[75%] bg-primary"></div>
<!-- Pixel pattern on fill (optional detail) -->
<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSIvPgo8L3N2Zz4=')] opacity-20"></div>
</div>
<!-- Thumb (Coaster Cart abstraction) -->
<div class="absolute left-[75%] top-1/2 -translate-y-1/2 -translate-x-1/2 size-6 bg-white border-2 border-black rounded-sm shadow-sm cursor-pointer flex items-center justify-center">
<div class="w-3 h-1 bg-primary/50"></div>
</div>
</div>
</div>
<!-- SFX Volume Slider -->
<div class="bg-surface-dark border-2 border-border-retro rounded-sm p-4 shadow-retro-sm">
<div class="flex items-center justify-between mb-3">
<label class="text-primary font-bold tracking-wide text-sm">SFX VOLUME</label>
<span class="text-white font-mono text-sm bg-black/40 px-2 py-0.5 rounded-sm">50%</span>
</div>
<div class="relative flex h-6 w-full items-center">
<div class="flex h-3 w-full rounded-sm bg-black/60 border border-border-retro relative overflow-hidden">
<div class="h-full w-[50%] bg-primary"></div>
</div>
<div class="absolute left-[50%] top-1/2 -translate-y-1/2 -translate-x-1/2 size-6 bg-white border-2 border-black rounded-sm shadow-sm cursor-pointer flex items-center justify-center">
<div class="w-3 h-1 bg-primary/50"></div>
</div>
</div>
</div>
</section>
<!-- Gameplay Section -->
<section>
<div class="flex items-center gap-3 mb-4">
<span class="material-symbols-outlined text-primary">sports_esports</span>
<h3 class="text-white text-lg font-bold tracking-wide uppercase border-b-2 border-primary/50 flex-1 pb-1">Gameplay</h3>
</div>
<!-- Vibration Toggle -->
<div class="bg-surface-dark border-2 border-border-retro rounded-sm p-4 shadow-retro-sm mb-3 flex items-center justify-between">
<span class="text-white font-bold tracking-wide text-sm">HAPTIC FEEDBACK</span>
<!-- Retro Toggle Switch -->
<button aria-pressed="true" class="relative h-8 w-14 rounded-sm border-2 border-border-retro bg-black/40 transition-colors focus:outline-none">
<div class="absolute left-1 top-1 h-5 w-5 bg-primary rounded-sm shadow-sm transition-transform translate-x-6 border border-white/20"></div>
</button>
</div>
<!-- Customize Controls Button -->
<button class="w-full bg-surface-dark border-2 border-border-retro hover:border-primary active:bg-primary/10 rounded-sm p-4 shadow-retro-sm flex items-center justify-between group transition-all">
<span class="text-white font-bold tracking-wide text-sm">CUSTOMIZE CONTROLS</span>
<span class="material-symbols-outlined text-primary group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</section>
<!-- System Section -->
<section>
<div class="flex items-center gap-3 mb-4">
<span class="material-symbols-outlined text-primary">settings_system_daydream</span>
<h3 class="text-white text-lg font-bold tracking-wide uppercase border-b-2 border-primary/50 flex-1 pb-1">System</h3>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="bg-surface-dark border-2 border-border-retro hover:border-primary rounded-sm p-3 shadow-retro-sm flex flex-col items-center justify-center gap-2 h-24 active:translate-y-1 active:shadow-none transition-all">
<span class="material-symbols-outlined text-primary text-3xl">info</span>
<span class="text-white font-bold tracking-wide text-xs">CREDITS</span>
</button>
<button class="bg-surface-dark border-2 border-red-900 hover:border-red-500 rounded-sm p-3 shadow-retro-sm flex flex-col items-center justify-center gap-2 h-24 active:translate-y-1 active:shadow-none transition-all group">
<span class="material-symbols-outlined text-red-600 group-hover:text-red-500 text-3xl">delete_forever</span>
<span class="text-red-500 font-bold tracking-wide text-xs">RESET DATA</span>
</button>
</div>
</section>
</main>
<!-- Footer -->
<footer class="p-6 pt-2 text-center opacity-40">
<div class="flex items-center justify-center gap-2 mb-2">
<div class="h-px bg-white/50 w-8"></div>
<div class="size-1 bg-white/50 rounded-full"></div>
<div class="h-px bg-white/50 w-8"></div>
</div>
<p class="text-white text-xs font-mono tracking-widest">VER 1.0.4 - BUILD 99T</p>
</footer>
</div>
</body></html>
